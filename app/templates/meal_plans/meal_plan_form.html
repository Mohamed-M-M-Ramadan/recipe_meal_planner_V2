<div class="card">
    <div class="card-header">
        <h2>Create New Meal Plan</h2>
    </div>
    <div class="card-body">
        <form id="meal-plan-form" onsubmit="return validateMealPlanForm()">
            <div class="form-group">
                <label for="plan-name">Plan Name</label>
                <input type="text" id="plan-name" class="form-control" required>
            </div>
            
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="start-date">Start Date</label>
                    <input type="date" id="start-date" class="form-control" required>
                </div>
                <div class="form-group col-md-6">
                    <label for="end-date">End Date</label>
                    <input type="date" id="end-date" class="form-control" required>
                </div>
            </div>
            
            <div id="plan-days" class="mt-4">
                <!-- Days will be dynamically generated -->
            </div>
            
            <button type="submit" class="btn btn-primary">Create Meal Plan</button>
        </form>
    </div>
</div>

<script>
function validateMealPlanForm() {
    const startDate = new Date(document.getElementById('start-date').value);
    const endDate = new Date(document.getElementById('end-date').value);
    
    if (startDate > endDate) {
        alert('End date must be after start date');
        return false;
    }
    return true;
}
</script>

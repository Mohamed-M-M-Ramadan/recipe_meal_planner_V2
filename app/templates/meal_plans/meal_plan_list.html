{% extends "base.html" %}
{% block content %}
    <h2>Your Meal Plans</h2>
    {% if meal_plans %}
        <ul>
            {% for plan in meal_plans %}
                <li>
                    <a href="{{ url_for('meal_plans.meal_plan_detail', plan_id=plan.id) }}">
                        {{ plan.name }}
                    </a>
                    ({{ plan.start_date }} - {{ plan.end_date }})
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>You have no meal plans yet.</p>
    {% endif %}
{% endblock %}
